[database]
user = "oscar"
password = "oscarpw"
host = "mariadb"
port = 3306
schema = "oscar"
# Must differ from the mariadb service's --server-id=1 (F12, E2).
server_id = 4321

[server]
health_port = 8080
webhook_port = 8081
grpc_port = 50051

[fhir]
base_url = "http://hapi:8080/fhir"
oscar_demographic_system = "https://arsmedicatech.com/fhir/sid/oscar-demographic-no"
oscar_hin_system = "https://arsmedicatech.com/fhir/sid/oscar-hin"

[sync]
checkpoint_path = "/var/lib/fhir-sync/checkpoint.json"
retry_max_attempts = 8
retry_base_ms = 500
dead_letter_path = "/var/lib/fhir-sync/dead_letter.jsonl"
