# Dispatch demo: points fhir-sync at demo/Config.dispatch.toml.
# The demo config is .gitignored so the consumer URL and .env secret stay local.
#
#   Run:
#   docker compose -f docker-compose.dispatch.yml up --build -d
#
#   Create a local .env with the consumer secret:
#   DISPATCH_CONSUMER_A_SECRET=<the-shared-secret>

services:
  hapi-a:
    image: hapiproject/hapi:v8.10.0
    environment:
      - hapi.fhir.fhir_version=R4
    ports:
      - "8082:8080"
    volumes:
      - hapi-a-state:/data/hapi

  fhir-sync:
    image: ${FHIR_SYNC_IMAGE:-ghcr.io/arsmedicatech/fhir-sync:main}
    depends_on:
      - hapi-a
    env_file:
      - .env
    environment:
      CONFIG_PATH: /demo/Config.dispatch.toml
      RUST_LOG: info
    volumes:
      - ./demo/Config.dispatch.toml:/demo/Config.dispatch.toml:ro
      - fhir-sync-dispatch-state:/var/lib/fhir-sync

volumes:
  hapi-a-state:
  fhir-sync-dispatch-state:
