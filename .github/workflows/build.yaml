name: build

on:
  push:
    branches: [main, stage, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, stage, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push on branch/tag pushes, not on PRs from forks
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache persisted in GitHub Actions cache — makes the
          # expensive dependency-compile layer reusable across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
  demo-smoke:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        run: echo "FHIR_SYNC_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Run demo stack against the image just built
        env:
          FHIR_SYNC_IMAGE: ${{ env.FHIR_SYNC_IMAGE }}
        run: |
          docker compose -f docker-compose.demo.yml up -d
          docker compose -f docker-compose.demo.yml exec -T mariadb \
            mysql -uoscar -poscarpw oscar < demo/insert_patient.sql

      - name: Assert the patient reached HAPI
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:8082/fhir/metadata" >/dev/null 2>&1 && break
            sleep 5
          done

          for i in $(seq 1 30); do
            body=$(curl -sS "http://localhost:8082/fhir/Patient?identifier=121" 2>&1)
            n=$(printf '%s' "$body" | jq -r '.total // empty' 2>/dev/null)
            if [ "$n" = "1" ]; then echo "synced"; exit 0; fi
            sleep 5
          done

          echo "=== last HAPI response ==="
          printf '%s\n' "$body"
          echo "=== fhir-sync logs ==="
          docker compose -f docker-compose.demo.yml logs fhir-sync
          exit 1
