# Dual-HAPI replication demo (compose-local only).
# Do not point this at fhir.synapticl.com.

#   Pull the latest:
#   docker compose -f docker-compose.replication.yml pull fhir-sync

#   Run the demo:
#   docker compose -f docker-compose.replication.yml up --build -d

#   Seed A:
#   Bash: ./demo/seed_a.sh
#   PowerShell: ./demo/seed_a.ps1
#
# Verify on B:
#   curl "http://localhost:8083/fhir/Patient?_summary=count"
#   curl.exe -s "http://localhost:8083/fhir/Patient?_summary=count"

# or, parsed:
#   (Invoke-RestMethod "http://localhost:8083/fhir/Patient?_summary=count").total

services:
  hapi-a:
    image: hapiproject/hapi:v8.10.0
    environment:
      - hapi.fhir.fhir_version=R4
    ports:
      - "8082:8080"
    volumes:
      - hapi-a-state:/data/hapi

  hapi-b:
    image: hapiproject/hapi:v8.10.0
    environment:
      - hapi.fhir.fhir_version=R4
    ports:
      - "8083:8080"
    volumes:
      - hapi-b-state:/data/hapi

  fhir-sync:
    #build:
    #  #context: .
    #  #dockerfile: Dockerfile
    #Using CI build for compute constraint reasons.
    image: ${FHIR_SYNC_IMAGE:-ghcr.io/arsmedicatech/fhir-sync:main}
    depends_on:
      - hapi-a
      - hapi-b
    environment:
      CONFIG_PATH: /demo/Config.replication.toml
      RUST_LOG: info
    volumes:
      - ./demo/Config.replication.toml:/demo/Config.replication.toml:ro
      - fhir-sync-replication-state:/var/lib/fhir-sync

volumes:
  hapi-a-state:
  hapi-b-state:
  fhir-sync-replication-state:
